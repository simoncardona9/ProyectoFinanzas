services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finanzas_dev}
      POSTGRES_USER: ${POSTGRES_USER:-finanzas_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  migrate:
    build:
      context: ./web
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-finanzas_app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-finanzas_dev}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: ./web
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-finanzas_app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-finanzas_dev}
      TEST_USER_EMAIL: ${TEST_USER_EMAIL:?Set TEST_USER_EMAIL in .env}
      TEST_USER_PASSWORD: ${TEST_USER_PASSWORD:?Set TEST_USER_PASSWORD in .env}
      TEST_HOUSEHOLD_NAME: ${TEST_HOUSEHOLD_NAME:-Test household}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["pnpm", "db:seed:test-user"]
    restart: "no"

  web:
    build:
      context: ./web
      target: runner
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-finanzas_app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-finanzas_dev}
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Terminates TLS and is the only service exposed outside Docker. Caddy uses a
  # publicly trusted certificate for a public DNS name, or its local CA for a
  # LAN IP address / local hostname.
  proxy:
    image: caddy:2.10-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
