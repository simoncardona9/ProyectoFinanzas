openapi: 3.1.0
info:
  title: Finanzas Familiares API
  version: 1.0.0
  description: Local-first API. Protected operations derive the active household from the server-side session; clients cannot select arbitrary household data.
paths:
  /api/v1/debts:
    get:
      operationId: listDebts
      summary: List active-household debts in their original currencies.
      description: All roles with an active household may read only that household's debt records. UYU and USD are returned separately and are never converted or combined.
      security: [{ sessionCookie: [] }]
      parameters:
        - {
            name: status,
            in: query,
            schema: { type: string, enum: [active, paid, cancelled] },
          }
        - {
            name: currency,
            in: query,
            schema: { type: string, enum: [UYU, USD] },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
        - {
            name: offset,
            in: query,
            schema: { type: integer, minimum: 0, default: 0 },
          }
      responses:
        "200":
          description: Household-scoped debt list, sorted by incurred date then creation time.
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [data],
                      properties:
                        {
                          data:
                            {
                              type: array,
                              items: { $ref: "#/components/schemas/Debt" },
                            },
                        },
                    },
                },
            }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createDebt
      summary: Create an active debt in its original currency.
      description: Requires owner or editor. The record and its create audit event are persisted atomically. The original and remaining balance are initialized to amountMinor; this operation does not affect cash, accounts, or currency exposure and is not idempotent.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DebtWrite" }
            example:
              {
                creditorName: "Banco de prueba",
                description: "Tarjeta de crédito",
                amountMinor: 125000,
                currency: USD,
                incurredDate: "2026-09-01",
              }
      responses:
        "201":
          {
            description: Debt and audit event created,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          { data: { $ref: "#/components/schemas/Debt" } },
                      },
                  },
              },
          }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Owner or editor role required }
  /api/v1/debts/{debtId}:
    get:
      operationId: getDebt
      summary: Get a debt and its audit history.
      description: All roles with an active household may read the requested debt only when it belongs to that household.
      security: [{ sessionCookie: [] }]
      parameters:
        - {
            name: debtId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200": { description: Household-scoped debt detail and audit events }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          {
            description: Debt does not belong to the active household or does not exist,
          }
  /api/v1/debts/{debtId}/payments:
    post:
      operationId: payDebt
      summary: Record a full or partial same-currency debt payment.
      description: Requires owner or editor and a debt in the active household. The active payment account must have the debt currency. The linked debt-payment transaction, debt-payment link, balance/status update, and audit event are one database transaction; if any write fails, none persist. This operation is not idempotent, so a client must not automatically retry after an unknown result.
      security: [{ sessionCookie: [] }]
      parameters:
        - {
            name: debtId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DebtPaymentWrite" }
            example:
              {
                amountMinor: 2500,
                accountId: "00000000-0000-4000-8000-000000000001",
                paidDate: "2026-09-06",
                description: "Pago parcial",
              }
      responses:
        "201":
          { description: Debt payment transaction and updated debt created }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Owner or editor role required }
        "404":
          {
            description: Debt does not belong to the active household or does not exist,
          }
        "409":
          { description: The debt changed while the payment was being applied }
        "422":
          {
            description: Inactive or mismatched-currency account,
            closed debt,
            or payment exceeding balance,
          }
  /api/v1/obligations:
    get:
      operationId: listObligations
      summary: List active-household obligations.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: dueFrom, in: query, schema: { type: string, format: date } }
        - { name: dueTo, in: query, schema: { type: string, format: date } }
        - {
            name: status,
            in: query,
            schema:
              {
                type: string,
                enum: [planned, pending, paid, deferred, cancelled],
              },
          }
      responses: { "200": { description: Obligations } }
    post:
      operationId: createObligation
      summary: Create a planned or pending household obligation.
      security: [{ sessionCookie: [] }]
      responses:
        {
          "201": { description: Obligation created },
          "400": { $ref: "#/components/responses/ValidationError" },
          "403": { description: Editor or owner role required },
        }
  /api/v1/obligations/{obligationId}/payments:
    post:
      operationId: payObligation
      summary: Record a full or partial obligation payment as a paid expense transaction.
      security: [{ sessionCookie: [] }]
      parameters:
        - {
            name: obligationId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        {
          "201": { description: Payment and linked transaction created },
          "422":
            {
              description: Invalid account,
              closed obligation,
              or payment exceeding balance,
            },
        }
  /api/v1/obligations/{obligationId}/defer:
    post:
      operationId: deferObligation
      summary: Move an open obligation to a later due date with an audit reason.
      security: [{ sessionCookie: [] }]
      parameters:
        - {
            name: obligationId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses: { "200": { description: Obligation deferred } }
  /api/v1/forecast:
    get:
      operationId: getMonthlyForecast
      summary: Return current cash and pending-obligation projection by currency for a calendar month.
      security: [{ sessionCookie: [] }]
      parameters:
        - {
            name: period,
            in: query,
            required: true,
            schema: { type: string, pattern: '^\\d{4}-(0[1-9]|1[0-2])$' },
          }
      responses:
        { "200": { description: Forecast with separate currency totals } }
  /api/v1/dashboard:
    get:
      operationId: getDashboard
      summary: Return the active household's traceable monthly dashboard.
      description: >
        Read-only, household-scoped summary. It returns separate UYU and USD
        totals; currencies are never converted or combined. Expected income is
        included only in projected cash, never current cash. Current cash comes
        from cash and bank accounts and paid movements, while the projection
        subtracts open obligations due during the requested month.
      security: [{ sessionCookie: [] }]
      parameters:
        - {
            name: period,
            in: query,
            required: true,
            schema: { type: string, pattern: '^\\d{4}-(0[1-9]|1[0-2])$' },
            example: "2026-09",
          }
      responses:
        "200":
          {
            description: Dashboard currencies with cash,
            paid income,
            one-off income,
            pending obligations,
            and projected cash.,
          }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Authenticate an active, provisioned user.
      description: Verifies an Argon2id password hash and issues a revocable opaque session cookie. No public registration exists.
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/LoginRequest" } },
            },
        }
      responses:
        {
          "200": { description: Session created },
          "400": { $ref: "#/components/responses/ValidationError" },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "403": { description: User has no household membership },
        }
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session and clear its cookie.
      responses:
        {
          "200":
            { description: Session revoked; idempotent when no session exists },
        }
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: Get the current user and memberships.
      security: [{ sessionCookie: [] }]
      responses:
        {
          "200": { description: Current user and active membership },
          "401": { $ref: "#/components/responses/Unauthorized" },
        }
  /api/v1/auth/active-household:
    post:
      operationId: setActiveHousehold
      summary: Select an existing membership as active household.
      security: [{ sessionCookie: [] }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [householdId],
                      properties:
                        { householdId: { type: string, format: uuid } },
                    },
                },
            },
        }
      responses:
        {
          "200": { description: Active household changed },
          "400": { $ref: "#/components/responses/ValidationError" },
          "403": { description: Membership required },
        }
  /api/v1/household:
    get:
      operationId: getHousehold
      summary: Get active household settings.
      security: [{ sessionCookie: [] }]
      responses:
        {
          "200": { description: Active household },
          "401": { $ref: "#/components/responses/Unauthorized" },
        }
    patch:
      operationId: updateHousehold
      summary: Update active household settings.
      description: Owner only. The active household is server-scoped.
      security: [{ sessionCookie: [] }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/HouseholdSettings" } },
            },
        }
      responses:
        {
          "200": { description: Updated household },
          "400": { $ref: "#/components/responses/ValidationError" },
          "403": { description: Owner role required },
        }
  /api/v1/household/members:
    get:
      operationId: listHouseholdMembers
      summary: List active-household members.
      description: Owner only; all results are server-scoped to the active household.
      security: [{ sessionCookie: [] }]
      responses:
        {
          "200": { description: Members },
          "403": { description: Owner role required },
        }
    post:
      operationId: inviteHouseholdMember
      summary: Add or update a provisioned user's household role.
      description: Owner only. The email must already be created by the controlled administrative process; this operation has no email-delivery side effect.
      security: [{ sessionCookie: [] }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/MemberInvite" } },
            },
        }
      responses:
        {
          "201": { description: Membership created or role updated },
          "400": { $ref: "#/components/responses/ValidationError" },
          "403": { description: Owner role required },
          "422": { description: User is not provisioned },
        }
  /api/v1/accounts:
    get:
      {
        operationId: listAccounts,
        summary: List active-household accounts,
        security: [{ sessionCookie: [] }],
        responses: { "200": { description: Accounts } },
      }
    post:
      {
        operationId: createAccount,
        summary: Create an active-household account,
        security: [{ sessionCookie: [] }],
        requestBody:
          {
            required: true,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/AccountWrite" } },
              },
          },
        responses:
          {
            "201": { description: Account created },
            "400": { $ref: "#/components/responses/ValidationError" },
            "403": { description: Editor or owner role required },
          },
      }
  /api/v1/accounts/{accountId}:
    parameters:
      [
        {
          name: accountId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        },
      ]
    get:
      {
        operationId: getAccount,
        summary: Get a household-scoped account,
        security: [{ sessionCookie: [] }],
        responses:
          {
            "200": { description: Account },
            "404": { description: Not found },
          },
      }
    patch:
      {
        operationId: updateAccount,
        summary: Update account metadata,
        security: [{ sessionCookie: [] }],
        responses: { "200": { description: Account updated } },
      }
  /api/v1/accounts/{accountId}/archive:
    post:
      {
        operationId: archiveAccount,
        summary: Archive an account while retaining prior history,
        security: [{ sessionCookie: [] }],
        responses: { "200": { description: Account archived } },
      }
  /api/v1/accounts/{accountId}/activate:
    parameters:
      [
        {
          name: accountId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        },
      ]
    post:
      {
        operationId: activateAccount,
        summary: Reactivate an archived account while retaining prior history,
        description: Active-household owner/editor operation; the account is made available for new entries and its archived timestamp is cleared.,
        security: [{ sessionCookie: [] }],
        responses:
          {
            "200": { description: Account reactivated },
            "403": { description: Editor or owner role required },
            "404": { description: Account not found },
          },
      }
  /api/v1/household/reset-test-data:
    post:
      {
        operationId: resetHouseholdTestData,
        summary: Reset active-household financial test data in local development,
        description: Development-only,
        owner-only destructive operation. It requires the exact confirmation `RESET TEST DATA`,
        removes financial structure,
        records,
        links,
        and audit logs for the active household,
        and preserves users,
        memberships,
        sessions,
        ? and household settings. It returns 404 in production.
          security
        : [{ sessionCookie: [] }],
        responses:
          {
            "200": { description: Active-household financial test data reset },
            "400": { description: Missing or incorrect confirmation },
            "403": { description: Owner role required },
            "404": { description: Reset unavailable outside local development },
          },
      }
  /api/v1/categories:
    get:
      {
        operationId: listCategories,
        summary: List active-household category hierarchy,
        security: [{ sessionCookie: [] }],
        responses: { "200": { description: Categories } },
      }
    post:
      {
        operationId: createCategory,
        summary: Create a household-scoped category,
        security: [{ sessionCookie: [] }],
        requestBody:
          {
            required: true,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/CategoryWrite" } },
              },
          },
        responses:
          {
            "201": { description: Category created },
            "400": { $ref: "#/components/responses/ValidationError" },
          },
      }
  /api/v1/categories/seed:
    post:
      {
        operationId: seedCategories,
        summary: Install the controlled workbook-derived category set when no categories exist,
        security: [{ sessionCookie: [] }],
        responses: { "201": { description: Categories installed } },
      }
  /api/v1/categories/{categoryId}:
    parameters:
      [
        {
          name: categoryId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        },
      ]
    get:
      {
        operationId: getCategory,
        summary: Get a household-scoped category,
        security: [{ sessionCookie: [] }],
        responses: { "200": { description: Category } },
      }
    patch:
      {
        operationId: updateCategory,
        summary: Rename or reclassify a category,
        security: [{ sessionCookie: [] }],
        responses: { "200": { description: Category updated } },
      }
  /api/v1/categories/{categoryId}/archive:
    post:
      {
        operationId: archiveCategory,
        summary: Archive a category after child validation,
        security: [{ sessionCookie: [] }],
        responses:
          {
            "200": { description: Category archived },
            "409": { description: Active child categories remain },
          },
      }
  /api/v1/transactions:
    get:
      operationId: listPaidTransactions
      summary: List paid UYU or USD income and expense transactions for the active household.
      description: Supports optional inclusive `from`/`to` dates, account/category UUIDs, type, currency, recurring/one-off flags, and offset pagination. Results are household-scoped; currency-specific totals are never combined.
      security: [{ sessionCookie: [] }]
      parameters:
        - {
            name: from,
            in: query,
            required: false,
            schema: { type: string, format: date },
          }
        - {
            name: to,
            in: query,
            required: false,
            schema: { type: string, format: date },
          }
        - {
            name: accountId,
            in: query,
            required: false,
            schema: { type: string, format: uuid },
          }
        - {
            name: categoryId,
            in: query,
            required: false,
            schema: { type: string, format: uuid },
          }
        - {
            name: type,
            in: query,
            required: false,
            schema: { type: string, enum: [income, expense] },
          }
        - {
            name: currency,
            in: query,
            required: false,
            schema: { type: string, enum: [UYU, USD] },
          }
        - {
            name: isRecurring,
            in: query,
            required: false,
            schema: { type: boolean },
          }
        - {
            name: isOneOff,
            in: query,
            required: false,
            schema: { type: boolean },
          }
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
        - {
            name: offset,
            in: query,
            required: false,
            schema: { type: integer, minimum: 0, default: 0 },
          }
      responses:
        {
          "200": { description: Paid transaction list },
          "400": { $ref: "#/components/responses/ValidationError" },
          "401": { $ref: "#/components/responses/Unauthorized" },
        }
    post:
      operationId: createPaidTransaction
      summary: Record a paid UYU or USD income or expense.
      description: "Owner/editor only. The operation validates active, household-scoped account and category references; their currency/type must match. It atomically creates the transaction and audit event, then returns the account balance and paid expense-category total. This operation is not idempotent: retry only after confirming that no transaction was created."
      security: [{ sessionCookie: [] }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/PaidTransactionWrite" },
                  example:
                    {
                      date: "2026-09-04",
                      type: expense,
                      status: paid,
                      amountMinor: 125050,
                      currency: UYU,
                      accountId: "11111111-1111-4111-8111-111111111111",
                      categoryId: "22222222-2222-4222-8222-222222222222",
                      description: "Compra de supermercado",
                    },
                },
            },
        }
      responses:
        {
          "201": { description: Transaction and updated financial totals },
          "400": { $ref: "#/components/responses/ValidationError" },
          "403": { description: Editor or owner role required },
          "422":
            {
              description: INVALID_ACCOUNT,
              INVALID_CATEGORY,
              or CURRENCY_MISMATCH,
            },
        }
  /api/v1/transactions/{transactionId}:
    get:
      operationId: getTransaction
      summary: Get one household-scoped transaction and its audit events.
      security: [{ sessionCookie: [] }]
      parameters:
        - {
            name: transactionId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        {
          "200": { description: Transaction detail },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "404": { description: Transaction not found },
        }
    patch:
      operationId: updatePaidTransaction
      summary: Correct a paid transaction with an audit reason.
      description: "Owner/editor only. The original values and correction reason are saved in the audit log atomically with the update. Cancelled or voided transactions cannot be changed."
      security: [{ sessionCookie: [] }]
      parameters:
        - {
            name: transactionId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/PaidTransactionUpdate" },
                },
            },
        }
      responses:
        {
          "200": { description: Transaction corrected },
          "400": { $ref: "#/components/responses/ValidationError" },
          "403": { description: Editor or owner role required },
          "409": { description: Concurrent modification },
          "422": { description: Invalid references or status transition },
        }
  /api/v1/transactions/{transactionId}/void:
    post:
      operationId: voidPaidTransaction
      summary: Void a paid transaction with an audit reason.
      description: "Owner/editor only. The transaction becomes cancelled and no longer affects paid balances; the operation and original values are audit logged atomically."
      security: [{ sessionCookie: [] }]
      parameters:
        - {
            name: transactionId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/VoidTransactionWrite" },
                },
            },
        }
      responses:
        {
          "200": { description: Transaction voided },
          "400": { $ref: "#/components/responses/ValidationError" },
          "403": { description: Editor or owner role required },
          "409": { description: Concurrent modification },
          "422": { description: Invalid status transition },
        }
  /api/v1/imports/json/preview:
    post:
      operationId: previewJsonImport
      summary: Stage and validate a JSON batch-entry bundle.
      description: >
        Owner/editor only. The server scopes reference resolution to the active
        household and returns a preview without creating live financial records
        or changing balances. The Idempotency-Key identifies a retry of the
        same bundle; reusing it with different content is rejected.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/JsonImportBundle" },
                  example:
                    {
                      version: "finance-import/v1",
                      transactions:
                        [
                          {
                            date: "2026-08-05",
                            type: expense,
                            amountMinor: 125050,
                            currency: UYU,
                            account: "Banco República",
                            category: "Hogar y supermercado",
                            description: "Compra semanal",
                          },
                        ],
                    },
                },
            },
        }
      responses:
        {
          "200":
            {
              description: Staged import preview with row-level results and currency-separated totals,
            },
          "400": { $ref: "#/components/responses/ValidationError" },
          "403": { description: Editor or owner role required },
          "409":
            { description: Idempotency key was used with different content },
          "422":
            {
              description: Import has validation errors; no live records were created,
            },
        }
  /api/v1/imports/{importId}/commit:
    post:
      operationId: commitImport
      summary: Atomically commit a reviewed staged import.
      description: >
        Owner/editor only. The import must belong to the active household and
        have no unresolved validation errors. The server creates all approved
        records and audit events in one transaction or rolls back all changes.
        Retrying with the original idempotency key returns the prior result.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: importId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [confirmation],
                      properties:
                        { confirmation: { type: string, enum: [IMPORT] } },
                    },
                  example: { confirmation: IMPORT },
                },
            },
        }
      responses:
        {
          "201":
            {
              description: Import committed; response includes created-record counts and import audit ID,
            },
          "400": { $ref: "#/components/responses/ValidationError" },
          "403": { description: Editor or owner role required },
          "404": { description: Import not found in active household },
          "409":
            {
              description: Import is already committed or idempotency key conflicts,
            },
          "422":
            {
              description: Import has unresolved validation errors; no live records were created,
            },
        }
components:
  securitySchemes:
    { sessionCookie: { type: apiKey, in: cookie, name: finanzas_session } }
  schemas:
    LoginRequest:
      {
        type: object,
        required: [email, password],
        properties:
          {
            email: { type: string, format: email, example: owner@example.test },
            password: { type: string, format: password },
          },
      }
    HouseholdSettings:
      {
        type: object,
        required: [name, locale, defaultCurrency, timeZone],
        properties:
          {
            name: { type: string, example: Hogar Pérez },
            locale: { type: string, example: es-UY },
            defaultCurrency: { type: string, enum: [UYU, USD] },
            timeZone: { type: string, example: America/Montevideo },
          },
      }
    MemberInvite:
      {
        type: object,
        required: [email, role],
        properties:
          {
            email:
              { type: string, format: email, example: viewer@example.test },
            role: { type: string, enum: [editor, viewer, accountant] },
          },
      }
    AccountWrite:
      {
        type: object,
        required:
          [name, type, currency, openingBalanceMinor, openingBalanceDate],
        properties:
          {
            name: { type: string },
            type:
              {
                type: string,
                enum: [cash, bank, card, loan, reserve_envelope],
              },
            currency: { type: string, enum: [UYU, USD] },
            openingBalanceMinor: { type: integer },
            openingBalanceDate: { type: string, format: date },
          },
      }
    CategoryWrite:
      {
        type: object,
        required: [name, kind],
        properties:
          {
            name: { type: string },
            kind: { type: string, enum: [income, expense, transfer] },
            parentId: { type: [string, "null"], format: uuid },
            defaultClassification:
              {
                type: [string, "null"],
                enum: [fixed, variable, discretionary, null],
              },
          },
      }
    PaidTransactionWrite:
      {
        type: object,
        required:
          [
            date,
            type,
            status,
            amountMinor,
            currency,
            accountId,
            categoryId,
            description,
          ],
        properties:
          {
            date: { type: string, format: date },
            type: { type: string, enum: [income, expense] },
            status: { type: string, enum: [paid] },
            amountMinor: { type: integer, minimum: 1, maximum: 2000000000 },
            currency: { type: string, enum: [UYU, USD] },
            accountId: { type: string, format: uuid },
            categoryId: { type: string, format: uuid },
            description: { type: string, minLength: 1, maxLength: 500 },
            isRecurring: { type: boolean, default: false },
            isOneOff: { type: boolean, default: false },
          },
      }
    DebtWrite:
      {
        type: object,
        required:
          [creditorName, description, amountMinor, currency, incurredDate],
        properties:
          {
            creditorName: { type: string, minLength: 1, maxLength: 200 },
            description: { type: string, minLength: 1, maxLength: 500 },
            amountMinor: { type: integer, minimum: 1, maximum: 2000000000 },
            currency: { type: string, enum: [UYU, USD] },
            incurredDate: { type: string, format: date },
          },
      }
    Debt:
      {
        type: object,
        required:
          [
            id,
            creditorName,
            description,
            originalAmountMinor,
            remainingAmountMinor,
            currency,
            incurredDate,
            status,
          ],
        properties:
          {
            id: { type: string, format: uuid },
            creditorName: { type: string },
            description: { type: string },
            originalAmountMinor: { type: integer },
            remainingAmountMinor: { type: integer },
            currency: { type: string, enum: [UYU, USD] },
            incurredDate: { type: string, format: date },
            status: { type: string, enum: [active, paid, cancelled] },
          },
      }
    DebtPaymentWrite:
      {
        type: object,
        required: [amountMinor, accountId, paidDate],
        properties:
          {
            amountMinor: { type: integer, minimum: 1, maximum: 2000000000 },
            accountId: { type: string, format: uuid },
            paidDate: { type: string, format: date },
            description: { type: string, minLength: 1, maxLength: 500 },
          },
      }
    PaidTransactionUpdate:
      {
        type: object,
        required:
          [
            date,
            type,
            amountMinor,
            currency,
            accountId,
            categoryId,
            description,
            changeReason,
          ],
        properties:
          {
            date: { type: string, format: date },
            type: { type: string, enum: [income, expense] },
            amountMinor: { type: integer, minimum: 1, maximum: 2000000000 },
            currency: { type: string, enum: [UYU, USD] },
            accountId: { type: string, format: uuid },
            categoryId: { type: string, format: uuid },
            description: { type: string, minLength: 1, maxLength: 500 },
            isRecurring: { type: boolean, default: false },
            isOneOff: { type: boolean, default: false },
            changeReason: { type: string, minLength: 3, maxLength: 500 },
          },
      }
    VoidTransactionWrite:
      {
        type: object,
        required: [reason],
        properties: { reason: { type: string, minLength: 3, maxLength: 500 } },
      }
    JsonImportBundle:
      {
        type: object,
        required: [version],
        properties:
          {
            version: { type: string, enum: ["finance-import/v1"] },
            accounts: { type: array, items: { type: object } },
            categories: { type: array, items: { type: object } },
            transactions:
              {
                type: array,
                items:
                  {
                    type: object,
                    required:
                      [
                        date,
                        type,
                        amountMinor,
                        currency,
                        account,
                        category,
                        description,
                      ],
                    properties:
                      {
                        date: { type: string, format: date },
                        type: { type: string, enum: [income, expense] },
                        amountMinor:
                          { type: integer, minimum: 1, maximum: 2000000000 },
                        currency: { type: string, enum: [UYU, USD] },
                        account: { type: string, minLength: 1, maxLength: 120 },
                        category:
                          { type: string, minLength: 1, maxLength: 120 },
                        description:
                          { type: string, minLength: 1, maxLength: 500 },
                        isRecurring: { type: boolean, default: false },
                        isOneOff: { type: boolean, default: false },
                      },
                  },
              },
            obligations: { type: array, items: { type: object } },
            expectedIncome: { type: array, items: { type: object } },
          },
      }
    Error:
      {
        type: object,
        required: [error],
        properties:
          {
            error:
              {
                type: object,
                required: [code, message],
                properties:
                  {
                    code: { type: string },
                    message: { type: string },
                    fields:
                      { type: object, additionalProperties: { type: string } },
                  },
              },
          },
      }
  responses:
    ValidationError:
      {
        description: Invalid request,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
    Unauthorized:
      {
        description: Valid session required,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
